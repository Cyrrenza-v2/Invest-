name: Supabase Migration Safety

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Deploy migrations to production after validation (requires production environment approval)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migration-integrity:
    name: Verify migration history is complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify expected production migration files are present and ordered
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "20261010055354_invest_broker_shared_platform_foundation.sql"
            "20261010055614_invest_broker_user_portal_support_features.sql"
            "20261010055730_invest_broker_notification_read_state.sql"
            "20261010060308_invest_broker_double_entry_ledger.sql"
            "20261010060317_invest_broker_ledger_posting_guard.sql"
            "20261010133726_invest_broker_account_approval_gate.sql"
            "20261010133851_invest_broker_single_admin_control.sql"
            "20261010133958_invest_broker_atomic_account_review.sql"
            "20261010201831_bootstrap_single_primary_admin.sql"
            "20261011171226_phase_2_realtime_admin_customer_updates.sql"
            "20261011221255_platform_control_deny_client_access.sql"
            "20261011221826_ledger_posting_requires_all_pending_lines.sql"
            "20261012104812_payment_provider_test_scaffold.sql"
            "20261012155617_deny_browser_access_payment_provider_tables.sql"
            "20261015002132_revoke_api_access_from_foreign_table.sql"
          )
          missing=0
          for file in "${expected[@]}"; do
            if [[ ! -f "supabase/migrations/$file" ]]; then
              echo "::error file=supabase/migrations/$file::Migration recorded in live Supabase history is missing from Git."
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Migration history is incomplete. Recover the original SQL from trusted sources before enabling database deployment."
            exit 1
          fi
          actual_count="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l | tr -d ' ')"
          if [[ "$actual_count" -ne "${#expected[@]}" ]]; then
            echo "::error::Expected exactly ${#expected[@]} tracked migration SQL files, found $actual_count. Review unexpected or duplicate migrations."
            exit 1
          fi
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected-migrations.txt
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort > /tmp/actual-migrations.txt
          diff -u /tmp/expected-migrations.txt /tmp/actual-migrations.txt
          echo "All 15 migration filenames match the recorded production history."

  local-replay:
    name: Replay migrations in isolated local PostgreSQL
    runs-on: ubuntu-latest
    needs: migration-integrity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Initialize Supabase local configuration if absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f supabase/config.toml ]]; then
            npx --yes supabase@latest init
          fi
      - name: Start isolated Supabase stack
        run: npx --yes supabase@latest start
      - name: Replay complete migration chain from an empty database
        run: npx --yes supabase@latest db reset --local
      - name: Lint local schema
        run: npx --yes supabase@latest db lint --local
      - name: Stop isolated Supabase stack
        if: always()
        run: npx --yes supabase@latest stop --no-backup

  production-deploy:
    name: Production migration deployment (manual + approval)
    runs-on: ubuntu-latest
    needs: [migration-integrity, local-replay]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Require deployment credentials without printing secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || { echo "::error::Missing SUPABASE_ACCESS_TOKEN Actions secret."; exit 1; }
          [[ -n "$SUPABASE_DB_PASSWORD" ]] || { echo "::error::Missing SUPABASE_DB_PASSWORD Actions secret."; exit 1; }
          [[ -n "$SUPABASE_PROJECT_REF" ]] || { echo "::error::Missing SUPABASE_PROJECT_REF Actions variable."; exit 1; }
      - name: Link to configured Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Preview pending production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --dry-run
      - name: Apply approved production migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push
