name: User app - build and approval tests

on:
  push:
    branches: ["main", "fix/approved-user-login"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --package-lock=false
      - name: Test account approval gate
        run: npm test
      - name: Build customer app
        run: npm run build
