name: Deploy Slack AI workflow preview to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "slack-ai-workflow/web/**"
      - ".github/workflows/deploy-slack-ai-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slack-ai-preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload preview site
        uses: actions/upload-pages-artifact@v4
        with:
          path: slack-ai-workflow/web
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
